name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build do front-end (React)
        working-directory: web
        run: npm ci || npm install && npm run build
      - name: Build da API
        run: dotnet build src/AgendaPet.Api/AgendaPet.Api.csproj -c Release
      - name: Testes (xUnit)
        run: dotnet test tests/AgendaPet.Tests/AgendaPet.Tests.csproj -c Release
